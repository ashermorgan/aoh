name: AoH CI/CD

on:
  push:
    paths-ignore:
      - README.md

  pull_request:
    paths-ignore:
      - README.md

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest tests.unit


  run-e2e-tests-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run end-to-end tests
        run: ./tests/e2e/run.sh


  run-e2e-tests-windows:
    runs-on: windows-2025

    env:
      DOCKER_HOST: tcp://127.0.0.1:2375

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Replace symlinks with copies
        run: |
          Remove-Item -LiteralPath .\aoh\templates\client.py -Force
          Copy-Item -LiteralPath .\aoh\client.py -Destination .\aoh\templates\client.py

      - name: Install Alpine Linux in WSL
        run: |
          wsl --install --no-distribution
          $url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.2-x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile alpine.tar.gz
          wsl --install --name Alpine --from-file alpine.tar.gz

      - name: Install Docker in WSL
        run: |
          wsl -d Alpine -- apk update
          wsl -d Alpine -- apk add docker
          wsl -d Alpine -- sh -c 'mkdir -p /etc/docker && echo "{\"hosts\": [\"tcp://127.0.0.1:2375\", \"unix:///var/run/docker.sock\"]}" > /etc/docker/daemon.json'

      - name: Start dockerd in WSL
        run: |
          wsl -d Alpine -- sh -c 'nohup sleep infinity > /dev/null 2>&1 &'
          wsl -d Alpine -- sh -c 'nohup dockerd > /var/log/dockerd.log 2>&1 & sleep 15 && docker info'

      - name: Install Docker and Python
        run: choco install docker-cli python3 -y

      - name: Run end-to-end tests
        shell: powershell
        run: ./tests/e2e/run.ps1


  build-and-push-image:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'

    needs:
      - run-unit-tests
      - run-e2e-tests-linux
      - run-e2e-tests-windows

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
